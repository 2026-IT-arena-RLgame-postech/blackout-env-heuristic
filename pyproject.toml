[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackout-env"
version = "0.1.0"
description = "PettingZoo Parallel environment wrapper for the BlackOut Unity ML-Agents game"
requires-python = ">=3.10"
dependencies = [
    "pettingzoo>=1.24.0",
    "gymnasium>=0.29.0",
    "numpy>=1.23.5",
    # mlagents-envs is intentionally excluded: it declares pettingzoo==1.15.0 which
    # conflicts with pettingzoo>=1.24.0. Install it manually with --no-deps (see README).
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
test = ["tqdm"]
# Speeds up the heuristic policies (blackout_env.heuristics): JIT-compiles the
# Dijkstra distance map shared by V2+ (advanced.py:_distance_map) to native code.
# Falls back to the pure-Python implementation automatically when absent.
fast = ["numba>=0.59"]

[tool.setuptools.packages.find]
where = ["."]
include = ["blackout_env*"]

[tool.setuptools.package-data]
blackout_env = ["semantic_map_config.json"]
